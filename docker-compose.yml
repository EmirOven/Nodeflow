version: '3.8'

services:
  nodeflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodeflow
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - nodeflow-data:/app/data
      - ./.nodely-published.json:/app/.nodely-published.json

volumes:
  nodeflow-data:
